name: Refresh data and publish dashboard

# Runs every day after data.gov.my updates the CSV (around 21:00 UTC),
# on every push to main, and on demand. R builds the dashboard as a static
# site (scripts/build_static.R) and GitHub Pages serves it.
on:
  schedule:
    - cron: "17 22 * * *"      # 06:17 Malaysia time
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to keep the forecast log on its own branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::jsonlite
            any::dplyr
            any::tidyr
            any::readr
            any::lubridate
            any::janitor
            any::testthat

      - name: Run tests (frozen snapshot reproduces the FIT5145 report)
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'

      - name: Fetch the forecast log
        run: |
          mkdir -p app_data
          if git ls-remote --exit-code --heads origin forecast-log >/dev/null; then
            git fetch -q --depth 1 origin forecast-log
            git show FETCH_HEAD:forecast_log.csv > app_data/forecast_log.csv
          fi

      - name: Download the latest official data and rebuild results
        run: Rscript scripts/build_data.R

      # Every published forecast is kept on the forecast-log branch and never edited, so the
      # site's track record can be checked against the history of that branch.
      - name: Save the forecast log
        run: |
          log="$PWD/app_data/forecast_log.csv"
          dir="$(mktemp -d)"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" forecast-log >/dev/null; then
            git clone -q --depth 1 -b forecast-log "$url" "$dir"
          else
            git init -q -b forecast-log "$dir"
            git -C "$dir" remote add origin "$url"
          fi
          cp "$log" "$dir/forecast_log.csv"
          cd "$dir"
          git config user.name "SiobhanGoh"
          git config user.email "siobhangoh17@gmail.com"
          git add forecast_log.csv
          git commit -q -m "Forecasts issued with data to $(tail -n 1 forecast_log.csv | cut -d, -f1 | tr -d '\"')" || echo "No new forecasts."
          git push -q origin forecast-log

      - name: Build the static site
        run: Rscript scripts/build_static.R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
