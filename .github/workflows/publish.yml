name: Refresh data and publish dashboard

# Runs every day after data.gov.my updates the CSV (around 21:00 UTC),
# on every push to main, and on demand. R builds the dashboard as a static
# site (scripts/build_static.R) and GitHub Pages serves it.
on:
  schedule:
    - cron: "17 22 * * *"      # 06:17 Malaysia time
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; each job below asks only for what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::bslib
            any::jsonlite
            any::dplyr
            any::tidyr
            any::readr
            any::lubridate
            any::janitor
            any::testthat

      - name: Run tests (frozen snapshot reproduces the FIT5145 report)
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'

      # A missing branch (exit code 2) just means no forecasts have been logged yet. Any other
      # failure stops the run, so a network error can never start the log over from empty.
      - name: Fetch the forecast log
        run: |
          mkdir -p app_data
          code=0
          git ls-remote --exit-code --heads origin forecast-log >/dev/null || code=$?
          if [ "$code" -eq 0 ]; then
            git fetch -q --depth 1 origin forecast-log
            git show FETCH_HEAD:forecast_log.csv > app_data/forecast_log.csv
          elif [ "$code" -ne 2 ]; then
            echo "::error::Could not check the forecast-log branch (git exit code $code)."
            exit "$code"
          else
            echo "No forecast-log branch yet; starting a new log."
          fi

      # DarahWatch publishes its national forecast at 05:37 Malaysia time, before this run. If its
      # files are not there yet, the "Every state" page says so and the rest of the site is unchanged.
      - name: Fetch DarahWatch's national forecast
        run: |
          mkdir -p app_data/darahwatch
          base="https://raw.githubusercontent.com/SiobhanGoh/darahwatch/main"
          for f in latest/forecast.json evaluation/backtest.json; do
            if ! curl -fsSL --retry 3 "$base/$f" -o "app_data/darahwatch/$(basename "$f")"; then
              echo "::warning::DarahWatch's $f is not available yet; the Every state page will say so."
              rm -f app_data/darahwatch/*.json
              break
            fi
          done

      - name: Download the latest official data and rebuild results
        run: Rscript scripts/build_data.R

      - name: Build the static site
        run: Rscript scripts/build_static.R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: forecast-log
          path: app_data/forecast_log.csv
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Every published forecast is kept on the forecast-log branch and never edited, so the
  # site's track record can be checked against the history of that branch. This runs only
  # after the site deployed, so the log never records forecasts nobody could see.
  save-log:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forecast-log
          path: new-log

      - name: Save the forecast log
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The token goes in a header, never in a URL that git could print or store.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          url="https://github.com/$REPO.git"
          dir="$(mktemp -d)"
          code=0
          git -c http.extraheader="$auth" ls-remote --exit-code --heads "$url" forecast-log >/dev/null || code=$?
          if [ "$code" -eq 0 ]; then
            git -c http.extraheader="$auth" clone -q --depth 1 -b forecast-log "$url" "$dir"
          elif [ "$code" -eq 2 ]; then
            git init -q -b forecast-log "$dir"
            git -C "$dir" remote add origin "$url"
          else
            echo "::error::Could not check the forecast-log branch (git exit code $code)."
            exit "$code"
          fi
          cp new-log/forecast_log.csv "$dir/forecast_log.csv"
          cd "$dir"
          git config user.name "SiobhanGoh"
          git config user.email "siobhangoh17@gmail.com"
          git add forecast_log.csv
          if git diff --cached --quiet; then
            echo "No new forecasts."
            exit 0
          fi
          git commit -q -m "Forecasts issued with data to $(tail -n 1 forecast_log.csv | cut -d, -f1 | tr -d '\"')"
          git -c http.extraheader="$auth" push -q origin forecast-log
